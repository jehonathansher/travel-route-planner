<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Route Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top bar: trips menu · trip name -->
  <header id="topbar">
    <button id="btn-trips" class="icon-btn" aria-label="Trips">☰</button>
    <button id="trip-name" class="trip-name" title="Tap to rename">Loading…</button>
    <span class="topbar-spacer"></span>
  </header>

  <!-- Itinerary: your days and the places in each -->
  <section id="itinerary" class="panel collapsed">
    <button id="panel-handle" class="panel-handle">
      <span id="walk-total">No places yet</span>
      <span class="chevron">▲</span>
    </button>
    <div id="days" class="days"></div>
    <button id="btn-add-day" class="ghost-btn">＋ Add another day</button>
  </section>

  <!-- Slide-out drawer: switch / create / delete trips -->
  <aside id="trips-drawer" class="drawer">
    <div class="drawer-header">
      <h2>Trips</h2>
      <button id="btn-close-trips" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <button id="btn-new-trip" class="primary-btn">＋ New trip</button>
    <ul id="trips-list" class="trips-list"></ul>
  </aside>

  <!-- Bottom sheet: add or change a place -->
  <section id="add-sheet" class="sheet">
    <div class="sheet-header">
      <h2 id="add-title">Add place</h2>
      <button id="btn-close-add" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="edit-note" class="edit-note" hidden></div>
    <label class="field-label">Search a place</label>
    <div id="place-input" class="place-slot"></div>
    <div id="mode-block">
      <label class="field-label">How do you get here?</label>
      <div id="mode-toggle" class="mode-toggle"></div>
    </div>
    <button id="btn-save-place" class="primary-btn" disabled>Add place</button>
  </section>

  <div id="scrim" class="scrim"></div>

  <div id="setup-overlay" class="setup-overlay" hidden>
    <div class="setup-card">
      <h1>Almost there 👋</h1>
      <p>Open <code>config.js</code> and paste in your <strong>Google Maps API key</strong>
         and <strong>Firebase config</strong>, then refresh. See the <strong>README</strong>.</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
