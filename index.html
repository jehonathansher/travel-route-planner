<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no keeps it feeling like an app on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <!-- Lets you "Add to Home Screen" and run full-screen like a native app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Route Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The map fills the whole screen and is the primary interface -->
  <div id="map"></div>

  <!-- Top bar: trips menu · active trip name · add segment -->
  <header id="topbar">
    <button id="btn-trips" class="icon-btn" aria-label="Show trips">☰</button>
    <button id="trip-name" class="trip-name" title="Tap to rename">Loading…</button>
    <button id="btn-add" class="icon-btn" aria-label="Add segment">＋</button>
  </header>

  <!-- Bottom panel: the active trip's segments (collapsible) -->
  <section id="segments-panel" class="panel collapsed">
    <button id="segments-handle" class="panel-handle">
      <span id="segments-summary">No segments yet</span>
      <span class="chevron">▲</span>
    </button>
    <ul id="segments-list" class="segments-list"></ul>
  </section>

  <!-- Slide-out drawer: switch / create / delete trips (secondary navigation) -->
  <aside id="trips-drawer" class="drawer">
    <div class="drawer-header">
      <h2>Trips</h2>
      <button id="btn-close-trips" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <button id="btn-new-trip" class="primary-btn">＋ New trip</button>
    <ul id="trips-list" class="trips-list"></ul>
  </aside>

  <!-- Bottom sheet: add a new segment -->
  <section id="add-sheet" class="sheet">
    <div class="sheet-header">
      <h2>Add segment</h2>
      <button id="btn-close-add" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <label class="field-label">From</label>
    <div id="start-input" class="place-slot"></div>
    <label class="field-label">To</label>
    <div id="end-input" class="place-slot"></div>
    <label class="field-label">Travel mode</label>
    <div id="mode-chips" class="mode-chips"></div>
    <button id="btn-save-segment" class="primary-btn" disabled>Add segment</button>
  </section>

  <!-- Dark backdrop shown behind the drawer / sheet -->
  <div id="scrim" class="scrim"></div>

  <!-- Shown when config.js still has the placeholder values -->
  <div id="setup-overlay" class="setup-overlay" hidden>
    <div class="setup-card">
      <h1>Almost there 👋</h1>
      <p>Open <code>config.js</code> and paste in your <strong>Google Maps API key</strong>
         and <strong>Firebase config</strong>, then refresh.</p>
      <p>Step-by-step instructions are in the <strong>README</strong>.</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
